# Temporary measurement for PR #212. Remove before delivery.
name: CI coverage comparison
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-coverage-comparison.yml
permissions:
  contents: read
jobs:
  collect:
    if: ${{ github.head_ref == 'codex/reduce-ci-time' }}
    name: Coverage for ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scope: [baseline, candidate]
    steps:
      - name: Check out measured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.scope == 'baseline' && 'feec4ddff4d7a75cbf5b1f918f2ba6a6f6fc3288' || github.sha }}
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.8.1'
      - name: Collect client coverage
        shell: pwsh
        run: |
          npm ci --prefix src/Workbench.Client --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Client install failed.' }
          npm run test:run --prefix src/Workbench.Client -- --coverage --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { throw 'Client coverage failed.' }
      - name: Collect server coverage
        shell: pwsh
        run: |
          $project = './tests/Workbench.Server.IntegrationTests/Workbench.Server.IntegrationTests.csproj'
          $result = 'artifacts/coverage/server'
          New-Item -ItemType Directory -Path $result -Force | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $result 'revision.txt')
          dotnet restore Workbench.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Coverage restore failed.' }
          dotnet build $project -c Debug --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Coverage build failed.' }
          dotnet test $project -c Debug --no-build --no-restore --list-tests | Set-Content (Join-Path $result 'inventory.log')
          if ($LASTEXITCODE -ne 0) { throw 'Coverage discovery failed.' }
          @'
          <RunSettings>
            <RunConfiguration><MaxCpuCount>1</MaxCpuCount></RunConfiguration>
            <DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage">
              <Configuration><Format>json,cobertura</Format><Include>[Workbench.Server]*,[Workbench.Database]*</Include></Configuration>
            </DataCollector></DataCollectors></DataCollectionRunSettings>
            <xUnit><ParallelizeAssembly>false</ParallelizeAssembly><ParallelizeTestCollections>false</ParallelizeTestCollections><MaxParallelThreads>1</MaxParallelThreads></xUnit>
          </RunSettings>
          '@ | Set-Content (Join-Path $result 'coverage.runsettings')
          dotnet test $project -c Debug --no-build --no-restore --collect 'XPlat Code Coverage' --settings (Join-Path $result 'coverage.runsettings') --results-directory $result --logger 'trx;LogFileName=results.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Server coverage failed.' }
      - name: Retain raw coverage and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.scope }}
          path: artifacts/coverage/
          if-no-files-found: error
