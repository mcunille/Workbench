name: Same-host final fixture comparison
on:
  push:
    branches: [codex/supplier-fixture-measurement]
permissions:
  contents: read
jobs:
  scheduling-pair:
    name: Candidate four workers then original baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: measurement
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35adcd568a4c846b54d7cd996c8c0d575ed93b98
          path: two
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fca470a6a2ec29f69c5fbd1934829a576eff3893
          path: four
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Prepare both checkouts and measure full gates
        shell: pwsh
        run: ./measurement/measurement/scheduling-pair.ps1 -Workspace . -OriginalBaseline -FourFirst
      - name: Retain timing, complete inventories and resource observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: same-host-final-evidence
          if-no-files-found: error
          path: |
            scheduling-pair.json
            runner-cpu.txt
            runner-memory.txt
            *-resources.jsonl
            two/artifacts/verification/**/gate.json
            two/artifacts/verification/**/stages.json
            two/artifacts/verification/**/inventory.json
            two/artifacts/verification/**/duration-dataset.json
            two/artifacts/verification/**/discovery.log
            two/artifacts/verification/**/timing.json
            two/artifacts/verification/**/*.trx
            two/artifacts/verification/**/test.log
            four/artifacts/verification/**/gate.json
            four/artifacts/verification/**/stages.json
            four/artifacts/verification/**/inventory.json
            four/artifacts/verification/**/duration-dataset.json
            four/artifacts/verification/**/discovery.log
            four/artifacts/verification/**/timing.json
            four/artifacts/verification/**/*.trx
            four/artifacts/verification/**/test.log

