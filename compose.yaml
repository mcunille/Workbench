name: workbench

services:
  app:
    image: workbench:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1654,gid=1654
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8080}:8080"
    environment:
      Storage__Provider: FileSystem
      Storage__InstallationId: "${WORKBENCH_INSTALLATION_ID:?Set WORKBENCH_INSTALLATION_ID to a stable installation UUID}"
      Storage__Root: /var/lib/workbench/blobs
      Storage__DurableVolume: "true"
      WORKBENCH_WEB_CONNECTION: "${WORKBENCH_WEB_CONNECTION:-}"
      WORKBENCH_TENANT_CONTEXT_PROOF_KEY_FILE: /run/secrets/workbench-tenant-context-proof-key
      WORKBENCH_DATA_PROTECTION_CERTIFICATE_PATH: /run/secrets/workbench-data-protection.pfx
      WORKBENCH_DATA_PROTECTION_CERTIFICATE_PASSWORD: "${WORKBENCH_DATA_PROTECTION_CERTIFICATE_PASSWORD:-}"
      WORKBENCH_KNOWN_PROXY: "${WORKBENCH_KNOWN_PROXY:?Set WORKBENCH_KNOWN_PROXY to the immediate proxy IP observed by the app container}"
    volumes:
      - "workbench-blobs:/var/lib/workbench/blobs"
      - "${WORKBENCH_DATA_PROTECTION_CERTIFICATE_FILE:-./workbench-data-protection.pfx}:/run/secrets/workbench-data-protection.pfx:ro"
      - "${WORKBENCH_TENANT_CONTEXT_PROOF_KEY_FILE:-./workbench-tenant-context-proof-key}:/run/secrets/workbench-tenant-context-proof-key:ro"
    healthcheck:
      test: ["CMD", "dotnet", "Workbench.Server.dll", "--health-check"]
      interval: 10s
      timeout: 6s
      start_period: 10s
      retries: 3

volumes:
  workbench-blobs:
